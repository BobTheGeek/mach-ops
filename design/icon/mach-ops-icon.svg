  <rect width="512" height="512" rx="112" fill="#0a1018"/>
  <g id="airframe" fill="#86F0A3" transform="translate(256 256) scale(0.34) translate(0 -500)">
    <polygon id="wing-r" points="40,560 272,660 272,700 40,760"/>
    <polygon id="wing-l" points="-40,560 -272,660 -272,700 -40,760"/>
