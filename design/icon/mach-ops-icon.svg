    <polygon id="fin" points="0,760 6,800 6,980 12,1000 -12,1000 -6,980 -6,800"/>
    <path id="fuselage" d="M0 0 L12 50 22 100 30 200 34 300 36 450 44 520 46 700 42 900 36 1000 L-36 1000 -42 900 -46 700 -44 520 -36 450 -34 300 -30 200 -22 100 -12 50 Z"/>
    <path id="radome" d="M0 0 L12 50 22 100 L-22 100 -12 50 Z"/>
